      business_id:
        type: string
      currency:
        type: string
    required:
    - amount
    - business_id
    - currency
    type: object
  internal_company.Company:
    properties:
      association_member_of:
        type: string
      country:
        type: string
      id:
        type: string
      name:
        type: string
      status:
        type: string
      type:
        type: string
      wallets:
        items:
          $ref: '#/definitions/internal_company.Wallet'
        type: array
    type: object
  internal_company.CreateRequest:
    properties:
      association:
        example: AUTO
        type: string
      country:
        example: UG
        type: string
      name:
        example: Kigezi Highland Safaris
        type: string
