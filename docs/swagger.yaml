      currency:
        type: string
      fee:
        type: string
      from_name:
        type: string
      gross:
        type: string
      id:
        type: string
      invoice_number:
        type: string
      kind:
        type: string
      net:
        type: string
      quote_amount:
        type: string
      quote_currency:
        type: string
      to_name:
        type: string
    type: object
  internal_company.TransactionList:
    properties:
      transactions:
        items:
          $ref: '#/definitions/internal_company.Transaction'
        type: array
    type: object
  internal_company.Wallet:
    properties:
      balance:
        type: string
      currency:
        type: string
      id:
        type: string
      is_default:
        type: boolean
      kind:
        type: string
      name:
        type: string
      username:
        type: string
    type: object
  internal_company.WalletActivity:
    properties:
      amount:
        type: string
      counterparty:
        type: string
      created_at:
        type: string
      currency:
        type: string
      direction:
        type: string
      id:
        type: string
      invoice_number:
        type: string
      kind:
        type: string
    type: object
  internal_company.WalletList:
    properties:
      wallets:
        items:
          $ref: '#/definitions/internal_company.Wallet'
        type: array
    type: object
  internal_company.WalletLookup:
    properties:
      currency:
        type: string
      kind:
        type: string
      name:
        type: string
      username:
        type: string
    type: object
  internal_company.WalletRequest:
    properties:
      currency:
        example: USD
        type: string
    required:
    - currency
    type: object
  internal_company.WithdrawalRequest:
    properties:
      amount:
        type: string
      bureau_id:
        type: string
      business_id:
        type: string
      currency:
        type: string
    required:
    - amount
    - bureau_id
    - business_id
    - currency
    type: object
  internal_itinerary.AssignRequest:
    properties:
      tourist_id:
        type: string
    required:
