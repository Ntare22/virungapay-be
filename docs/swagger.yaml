  internal_itinerary.Itinerary:
    properties:
      amount_due:
        type: string
      business_name:
        type: string
      currency:
        type: string
      customer_email:
        type: string
      customer_name:
        type: string
      days:
        items:
          $ref: '#/definitions/internal_itinerary.Day'
        type: array
      ends_on:
        type: string
      exclusions:
        items:
          type: string
        type: array
      id:
        type: string
      inclusions:
        items:
          type: string
        type: array
      inquiry_id:
        type: string
      invoice_number:
        type: string
      notes:
        items:
          type: string
        type: array
      package_id:
        type: string
      paid_at:
        type: string
      party_size:
        type: integer
      sent_at:
        type: string
      starts_on:
        type: string
      status:
        type: string
      summary:
        type: string
      title:
        type: string
      tourist_user_id:
        type: string
    type: object
  internal_itinerary.ItineraryList:
    properties:
      itineraries:
        items:
          $ref: '#/definitions/internal_itinerary.Itinerary'
