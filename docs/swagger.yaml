      id:
        type: string
      name:
        type: string
      username:
        type: string
    type: object
  internal_company.TouristList:
    properties:
      tourists:
        items:
          $ref: '#/definitions/internal_company.TouristAccount'
        type: array
    type: object
  internal_company.Transaction:
    properties:
