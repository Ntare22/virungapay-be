basePath: /
definitions:
  cmd_api.statusResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  internal_auth.AcceptRequest:
    properties:
      password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - password
    - token
    type: object
  internal_auth.ConfirmLoginCodeRequest:
    properties:
      code:
        example: "123456"
        type: string
      email:
        example: amelie@example.com
        type: string
    required:
    - code
    - email
    type: object
  internal_auth.ForgotRequest:
    properties:
      email:
        example: amelie@example.com
        type: string
    required:
    - email
    type: object
  internal_auth.LoginCodeRequest:
    properties:
      email:
        example: amelie@example.com
        type: string
    required:
    - email
    type: object
  internal_auth.LoginRequest:
    properties:
      email:
        example: amelie@example.com
        type: string
      password:
        example: correct horse
        type: string
    required:
    - email
    - password
    type: object
  internal_auth.MessageResponse:
    properties:
      message:
        type: string
    type: object
  internal_auth.ProfileRequest:
    properties:
      phone:
        example: "+256700000000"
        type: string
    required:
    - phone
    type: object
  internal_auth.PublicUser:
    properties:
      email:
        type: string
      email_verified:
        type: boolean
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      name:
        type: string
      organisation_id:
        type: string
      phone:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  internal_auth.RegisterResponse:
    properties:
      user:
        $ref: '#/definitions/internal_auth.PublicUser'
    type: object
  internal_auth.ResetRequest:
    properties:
      password:
        minLength: 8
        type: string
      token:
        type: string
    required:
    - password
    - token
    type: object
  internal_auth.Session:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/internal_auth.PublicUser'
    type: object
  internal_auth.TokenRequest:
    properties:
      token:
        type: string
    required:
    - token
    type: object
  internal_auth.TouristSignupRequest:
    properties:
      email:
        example: amelie@example.com
        type: string
      first_name:
        example: Amelie
        type: string
      last_name:
        example: Laurent
        type: string
    required:
    - email
    - first_name
    - last_name
