    type: object
  internal_company.RenameWalletRequest:
    properties:
      name:
        example: Safari float
        type: string
      username:
        example: safari-float
        type: string
    type: object
  internal_company.StatementLine:
    properties:
      amount:
        type: string
      created_at:
        type: string
      currency:
        type: string
      direction:
        type: string
      id:
        type: string
      kind:
        type: string
