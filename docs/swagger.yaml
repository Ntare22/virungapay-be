host: localhost:8080
info:
  contact: {}
  description: Simulated payments API for the VirungaPay MVP. PWA routes are under
    /v1. Staff routes are under /admin/v1.
  title: VirungaPay API
  version: "1.0"
paths:
  /admin/v1/auth/forgot-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ForgotRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.MessageResponse'
      summary: Admin forgot password
      tags:
      - auth
  /admin/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Signs in a staff role on /admin/v1. Tourists, operators, guides,
        and drivers are rejected.
      parameters:
      - description: Credentials
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.Session'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
      summary: Admin login
      tags:
      - auth
  /admin/v1/auth/reset-password:
    post:
      consumes:
      - application/json
      parameters:
      - description: Reset
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.ResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.MessageResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
      summary: Admin reset password
      tags:
      - auth
  /admin/v1/bureaus:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_company.BusinessList'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List forex bureaus
      tags:
      - companies
    post:
      consumes:
      - application/json
      description: Staff create a bureau that is already approved.
      parameters:
      - description: Bureau
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_company.BureauRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_company.Business'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Add a forex bureau
      tags:
      - companies
  /admin/v1/businesses:
    get:
      description: Lists operator companies and forex bureaus for staff.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_company.BusinessList'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List businesses
      tags:
      - companies
  /admin/v1/businesses/{id}/approve:
    post:
      parameters:
      - description: Business id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_company.Business'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Approve a business
      tags:
      - companies
  /admin/v1/businesses/{id}/disable:
    post:
      parameters:
      - description: Business id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_company.Business'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Disable a business
      tags:
      - companies
  /admin/v1/businesses/{id}/wallets:
    post:
      consumes:
      - application/json
      description: Staff open a USD wallet on an approved business. UGX wallets are
        created with the business.
      parameters:
      - description: Business id
        in: path
        name: id
        required: true
        type: string
      - description: Currency
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_company.WalletRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_company.Business'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/virungapay-be_internal_middleware.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Open a USD wallet
      tags:
      - wallets
  /admin/v1/businesses/{id}/wallets/{walletId}/default:
    post:
