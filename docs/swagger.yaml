      email:
        type: string
      name:
        type: string
      owner:
        type: string
      phone:
        type: string
    required:
    - country
    - email
    - name
    - owner
    type: object
  internal_company.Business:
    properties:
      association_member_of:
        type: string
      country:
        type: string
      id:
        type: string
      name:
        type: string
      owner_email:
        type: string
      owner_name:
        type: string
      status:
        type: string
      wallets:
        items:
          $ref: '#/definitions/internal_company.Wallet'
        type: array
    type: object
  internal_company.BusinessList:
