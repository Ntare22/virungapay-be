      customer_email:
        type: string
      customer_name:
        type: string
      ends_on:
        type: string
      id:
        type: string
      notes:
        type: string
      party_size:
        type: integer
      starts_on:
        type: string
    type: object
  internal_itinerary.InquiryList:
    properties:
      inquiries:
        items:
          $ref: '#/definitions/internal_itinerary.Inquiry'
        type: array
