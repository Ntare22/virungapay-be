    type: object
  internal_itinerary.PackageList:
    properties:
      packages:
        items:
          $ref: '#/definitions/internal_itinerary.Package'
        type: array
    type: object
  virungapay-be_internal_auth.PublicUser:
    properties:
      email:
        type: string
      email_verified:
        type: boolean
      first_name:
        type: string
      id:
        type: string
      last_name:
        type: string
      name:
        type: string
      organisation_id:
        type: string
      phone:
        type: string
      role:
        type: string
      status:
        type: string
    type: object
  virungapay-be_internal_auth.RegisterResponse:
    properties:
      user:
        $ref: '#/definitions/virungapay-be_internal_auth.PublicUser'
    type: object
  virungapay-be_internal_auth.SignupRequest:
    properties:
      email:
        example: amina@example.com
        type: string
      first_name:
        example: Amina
        type: string
      last_name:
        example: Kato
        type: string
      password:
        example: correct horse
        minLength: 8
