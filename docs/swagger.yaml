      integrator_rate:
        type: string
      markup_bps:
        type: integer
      pair:
        type: string
      quote_on:
        type: string
    type: object
  internal_company.TariffList:
    properties:
      tariffs:
        items:
          $ref: '#/definitions/internal_company.Tariff'
        type: array
    type: object
  internal_company.TariffRequest:
    properties:
      integrator_rate:
        type: string
      markup_bps:
        minimum: 0
        type: integer
      pair:
        example: USD/UGX
        type: string
    required:
    - integrator_rate
    - pair
    type: object
  internal_company.TipRequest:
    properties:
      amount:
        type: string
      currency:
        type: string
      from_user_id:
        type: string
      to_user_id:
        type: string
    required:
    - amount
    - currency
    - from_user_id
    - to_user_id
    type: object
  internal_company.TopUpRequest:
    properties:
      amount:
        type: string
      last4:
